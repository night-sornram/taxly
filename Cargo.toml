[workspace]
members = ["crates/taxly-core", "crates/wealth-core", "apps/desktop/src-tauri"]
default-members = ["crates/taxly-core", "crates/wealth-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1.40", features = ["serde-with-str"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Avoid Rust's Mach-O LINKEDIT stripping issue on recent macOS hosts:
# https://github.com/rust-lang/rust/issues/157750
strip = "none"
